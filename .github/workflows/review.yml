name: Apply ManaIntel review

on:
  workflow_dispatch:
    inputs:
      review_payload:
        description: Compact JSON copied from the ManaIntel review page
        required: true
        type: string
      deploy:
        description: Deploy GitHub Pages after validation
        required: true
        type: boolean
        default: true

concurrency:
  group: ffw-production-writer
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FFW_MODE: live
  PYTHONUNBUFFERED: "1"

jobs:
  review:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.persist.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ManaIntel
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run network-free tests
        env:
          FFW_MODE: mock
        run: python -m unittest discover -s tests -v

      - name: Apply and render review
        env:
          REVIEW_PAYLOAD: ${{ inputs.review_payload }}
        shell: bash
        run: python -m ffw apply-review --payload "$REVIEW_PAYLOAD" --actor "$GITHUB_ACTOR"

      - name: Validate reviewed archive
        run: python -m ffw validate

      - name: Persist review and projections
        id: persist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews archive
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(ffw): apply human review"
            git push origin HEAD:${{ github.event.repository.default_branch }}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build clean Pages artifact
        if: ${{ inputs.deploy }}
        shell: bash
        run: |
          mkdir -p _site/archive
          cp web/index.html web/app.js web/table.js web/styles.css web/summary.html web/summary.js web/review.html web/review.js _site/
          cp -R archive/. _site/archive/

      - name: Configure Pages
        if: ${{ inputs.deploy }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ inputs.deploy }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish review summary
        if: always()
        shell: bash
        run: |
          echo "## ManaIntel human review" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reviewer: $GITHUB_ACTOR" >> "$GITHUB_STEP_SUMMARY"
          echo "- Durable outputs changed: ${{ steps.persist.outputs.changed || 'unknown' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment requested: ${{ inputs.deploy }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: review
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
